<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Decalque pela Câmera</title>
<style>
  :root{--bg:#111;--fg:#f5f5f0;--accent:#ffb347;--panel:rgba(20,20,20,.85)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
  #stage{position:fixed;inset:0;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #img{position:absolute;left:50%;top:50%;transform-origin:center;pointer-events:none;user-select:none;max-width:none}
  #grid{position:absolute;inset:0;pointer-events:none;display:none;
    background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
    background-size:25% 25%}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button,label.btn{flex:1 1 auto;min-width:70px;padding:12px 8px;border:0;border-radius:10px;background:#2c2c2c;color:var(--fg);font-size:15px;font-weight:600;text-align:center;cursor:pointer}
  button.on{background:var(--accent);color:#111}
  label.btn.main{background:var(--accent);color:#111}
  input[type=range]{flex:1;accent-color:var(--accent);height:28px}
  .lbl{font-size:13px;min-width:90px}
  #msg{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;right:16px;padding:14px;border-radius:12px;background:var(--panel);font-size:15px;line-height:1.4;text-align:center}
  #toggle{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;min-width:auto;flex:none;padding:10px 14px;background:var(--panel)}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <img id="img" alt="">
  <div id="grid"></div>
</div>
<div id="msg">Toque em <b>Escolher imagem</b> e permita o uso da câmera.</div>
<button id="toggle">Esconder</button>
<div id="bar">
  <div class="row">
    <span class="lbl">Transparência</span>
    <input id="op" type="range" min="5" max="100" value="50">
  </div>
  <div class="row">
    <label class="btn main">Escolher imagem<input id="file" type="file" accept="image/*" hidden></label>
    <button id="lock">Travar</button>
  </div>
  <div class="row">
    <button id="flip">Espelhar</button>
    <button id="rot">Girar 90°</button>
    <button id="gridb">Grade</button>
    <button id="light">Lanterna</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const video=$('cam'),img=$('img'),msg=$('msg');
let s={x:0,y:0,scale:1,rot:0,flip:1},locked=false,track=null;

function apply(){img.style.transform=`translate(-50%,-50%) translate(${s.x}px,${s.y}px) rotate(${s.rot}deg) scale(${s.scale*s.flip},${s.scale})`}

async function startCam(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=st;track=st.getVideoTracks()[0];
    if(!img.src) msg.innerHTML='Câmera ligada. Agora toque em <b>Escolher imagem</b>.'; else msg.hidden=true;
  }catch(e){
    msg.innerHTML='Não consegui abrir a câmera. Verifique se você permitiu o acesso à câmera para este site (ícone de cadeado ao lado do endereço).';
  }
}
startCam();

$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{img.onload=()=>{
      const w=innerWidth*0.9;img.style.width=w+'px';img.style.height='auto';
      s={x:0,y:-40,scale:1,rot:0,flip:1};apply();msg.hidden=true;};
    img.src=r.result;};
  r.readAsDataURL(f);
};
$('op').oninput=e=>img.style.opacity=e.target.value/100;img.style.opacity=.5;

$('lock').onclick=e=>{locked=!locked;e.target.classList.toggle('on',locked);e.target.textContent=locked?'Travado':'Travar'};
$('flip').onclick=()=>{s.flip*=-1;apply()};
$('rot').onclick=()=>{s.rot=(s.rot+90)%360;apply()};
$('gridb').onclick=e=>{const g=$('grid');const on=g.style.display!=='block';g.style.display=on?'block':'none';e.target.classList.toggle('on',on)};
$('light').onclick=async e=>{
  if(!track)return;
  const on=!e.target.classList.contains('on');
  try{await track.applyConstraints({advanced:[{torch:on}]});e.target.classList.toggle('on',on)}
  catch(err){e.target.textContent='Sem lanterna'}
};
$('toggle').onclick=e=>{const b=$('bar');b.hidden=!b.hidden;e.target.textContent=b.hidden?'Mostrar':'Esconder'};

// arrastar e pinçar (1 dedo move, 2 dedos aumentam/diminuem)
const pts=new Map();let start=null;
const stage=$('stage');
function snap(){const p=[...pts.values()];
  start={s:{...s},p:p.map(a=>({...a})),d:p.length>1?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0,
    c:p.length>1?{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}:p[0]};}
stage.addEventListener('pointerdown',e=>{if(locked)return;stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});snap()});
stage.addEventListener('pointermove',e=>{
  if(locked||!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const p=[...pts.values()];
  if(p.length>1&&start.d){
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    const c={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};
    s.scale=Math.max(.1,Math.min(10,start.s.scale*d/start.d));
    s.x=start.s.x+(c.x-start.c.x);s.y=start.s.y+(c.y-start.c.y);
  }else{s.x=start.s.x+(p[0].x-start.c.x);s.y=start.s.y+(p[0].y-start.c.y)}
  apply();
});
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,e=>{pts.delete(e.pointerId);if(pts.size)snap()}));

// manter a tela acesa
async function wake(){try{await navigator.wakeLock.request('screen')}catch(e){}}
wake();document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
</script>
</body>
</html>
